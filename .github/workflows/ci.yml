name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Backend syntax + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile-check all backend modules
        run: python -m compileall -q backend
      - name: Install lightweight test deps
        # numpy is not optional here: forced_aligner imports it at module level,
        # and this step imports backend.main through it.
        run: pip install fastapi uvicorn httpx python-multipart numpy pytest
      # The pure-logic tests (chunking, text cleaning, resegmentation,
      # middleware, cancel/abort, path-leak) run without llama-server / GPU /
      # ffmpeg because the harness mocks them, so a failure here is a real
      # regression and fails the build. compileall above only byte-compiles; it
      # never imports, so it cannot catch a broken module-level import.
      - name: Run test suite (SKIP_LLAMA=1)
        env:
          SKIP_LLAMA: "1"
        run: python -m pytest backend/test_main.py -q
